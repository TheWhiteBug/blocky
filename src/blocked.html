<!DOCTYPE html>
<html>
<head>
  <title>Site blocked</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: white;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    #wrapper {
      position: relative;
      display: inline-block;
      line-height: 0;
    }

    #lama {
      display: block;
    }

    #bubble-container {
      position: absolute;
      top: -4%;
      left: -1%;
      width: 33%;
    }

    #bubble-container img {
      width: 100%;
      display: block;
    }

    #bubble-text {
      position: absolute;
      top: 7%;
      left: 9%;
      width: 72%;
      height: 52%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 20px;
      text-align: center;
      word-break: break-all;
      color: #111;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <img id="lama" src="lama2.png">
    <div id="bubble-container">
      <img src="thinking-overlay.png">
      <div id="bubble-text"></div>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
